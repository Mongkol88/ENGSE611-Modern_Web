<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="output" style="font-family: sans-serif;"></div>
    <button onclick="CheckGrade()" style="border-radius: 5px; font-family: sans-serif;">Run code</button>
    <Script>
        function CheckGrade() {
            const output = [];
            let score = Math.floor(Math.random() * 100) + 1;
            output.push("คะเเนนที่สุ่มได้: "+ score);
            console.log("คะเเนนที่สุ่มได้: ", score);
            if (score >= 80) {
                output.push("เกรด A");
                console.log("เกรด A");
            } else if (score >= 70 && score < 80) {
                output.push("เกรด B");
                console.log("เกรด B");
            } else if (score >= 60 && score < 70) {
                output.push("เกรด C");
                console.log("เกรด C");
            } else if (score >= 50 && score < 60) {
                output.push("เกรด D");
                console.log("เกรด D");
            } else  {
                output.push("เกรด F");
                console.log("เกรด F");
            }

            if (score >= 50) {
                output.push("ผลสอบ: ผ่าน");
                console.log("ผลสอบ: ผ่าน");
            } else {
                output.push("ผลสอบ: ไม่ผ่าน");
                console.log("ผลสอบ: ไม่ผ่าน");
            }
            document.getElementById("output").innerHTML = output.join("<br>");
        }
    </Script>
</body>
</html>
