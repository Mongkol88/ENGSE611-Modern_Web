        function runStringDemo() {

            output.push(`สวัสดี ${firstName}!`);

            console.log("ตัวใหญ่:", text.toUpperCase());

            output.push("ตัวเล็ก: " + text.toLowerCase());
            console.log("ตัวเล็ก:", text.toLowerCase());

            output.push('มี "Java"? ' + text.includes('Java'));
            console.log('มี "Java"?', text.includes('Java'));

            output.push('ตำแหน่ง "Script": ' + text.indexOf('Script'));
            console.log('ตำแหน่ง "Script":', text.indexOf('Script'));

            output.push("ตัดคำ (0-4): " + text.slice(0, 4));
            console.log("ตัดคำ (0-4):", text.slice(0, 4));

            output.push("แทนที่: " + text.replace('เจ๋ง', 'สุดยอด'));
            console.log("แทนที่:", text.replace('เจ๋ง', 'สุดยอด'));

        function runOperators() {
            const out = [];

            let a = 10, b = 3;
            out.push("1) Arithmetic");
            out.push("10 + 3 = " + (a + b));
            out.push("10 - 3 = " + (a - b));
            out.push("10 * 3 = " + (a * b));
            out.push("10 / 3 = " + (a / b));
            out.push("10 % 3 = " + (a % b));
            out.push("-----------------");

            out.push("2) Comparison");
            out.push("5 > 3: " + (5 > 3));
            out.push("5 == '5': " + (5 == '5'));
            out.push("5 === '5': " + (5 === '5'));
            out.push("-----------------");

            out.push("3) Logical");
            out.push("true && false: " + (true && false));
            out.push("true || false: " + (true || false));
            out.push("!true: " + (!true));
            out.push("-----------------");

            let x = 10;
            out.push("4) Assignment");
            out.push("x = 10 -> x += 5 = " + (x += 5));
            out.push("x -= 3 = " + (x -= 3));
            out.push("x *= 2 = " + (x *= 2));
            out.push("-----------------");

            let y = 5;
            out.push("5) Increment / Decrement");
            out.push("y = 5 -> y++ = " + (y++));
            out.push("หลัง y++ ค่า y = " + y);
            out.push("y-- = " + (y--));
            out.push("หลัง y-- ค่า y = " + y);
            out.push("-----------------");

            let age = 18;
            let result = age >= 18 ? "ผู้ใหญ่" : "เยาวชน";
            out.push("6) Ternary Operator");
            out.push("age = 18 -> result = " + result);
            out.push("-----------------");

            document.getElementById("output").textContent = out.join("\n");

            console.clear();
            out.forEach(line => console.log(line));
        }
    
        function runMath() {
            console.clear();
            const output = [];
            output.push(Math.ceil(Math.random() * 10));


            document.getElementById("output").textContent = output.join("\n");
        }
    
        function runConditional() {
            const output = [];

            let score = 72;

            if (score >= 50) {
                output.push("ผลสอบ: ผ่าน");
                console.log("ผลสอบ: ผ่าน");
            } else {
                output.push("ผลสอบ: ไม่ผ่าน");
                console.log("ผลสอบ: ไม่ผ่าน");
            }

            for (let i = 0; i < 5; i++) {
                output.push("รอบที่: " + i);
                console.log("รอบที่: ", i);
            }

            document.getElementById("output").textContent = output.join("\n");
        }
    </script>
